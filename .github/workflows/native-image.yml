name: native-image

# Plan §7 M0 step 3 / §2 CI row: the native binary is built and smoke-tested on
# every PR for all 5 targets — native-image breakage must be found continuously,
# not at packaging time.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'   # Oracle GraalVM (GFTC) — sandbox limits per plan A4
          cache: maven
      - run: mvn -B test

  native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,      target: linux-x64 }
          - { os: ubuntu-24.04-arm,   target: linux-arm64 }
          - { os: macos-15-intel,     target: macos-x64 }
          - { os: macos-latest,       target: macos-arm64 }
          - { os: windows-latest,     target: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          cache: maven
      - name: Build native image
        run: mvn -B -DskipTests -Pnative package
      - name: Smoke test (doctor + MCP handshake)
        shell: bash
        working-directory: core/target
        run: |
          ./token-guard --doctor
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | ./token-guard > out.jsonl
          grep -q '"protocolVersion"' out.jsonl
          grep -q '"tools"' out.jsonl
      - name: Enforce size gate (< 80 MB)
        shell: bash
        working-directory: core/target
        run: |
          # exact name: core/target also holds token-guard.jar / token-guard-all.jar
          bin=token-guard; [ -f token-guard.exe ] && bin=token-guard.exe
          size=$(wc -c < "$bin")
          echo "binary size: $size bytes"
          test "$size" -lt 83886080
      - name: Stage release artifact + checksum
        shell: bash
        working-directory: core/target
        run: |
          ext=""; [ "${{ matrix.target }}" = "windows-x64" ] && ext=".exe"
          cp "token-guard$ext" "token-guard-${{ matrix.target }}$ext"
          (sha256sum "token-guard-${{ matrix.target }}$ext" 2>/dev/null \
            || shasum -a 256 "token-guard-${{ matrix.target }}$ext") \
            > "token-guard-${{ matrix.target }}$ext.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: token-guard-${{ matrix.target }}
          path: |
            core/target/token-guard-${{ matrix.target }}*

  release:
    # Publishes the per-platform binaries + checksums the installers download.
    needs: native
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
